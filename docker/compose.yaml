# Monitoring for the Inference Lab: Prometheus scrapes whichever engine is
# running; Grafana shows both on one dashboard. The engines themselves are
# started by scripts/docker-vllm.sh and scripts/docker-sglang.sh on the same
# network (only one fits on the 3090 at a time).
#
#   docker compose -f docker/compose.yaml up -d      # Grafana: http://localhost:3000
#   docker compose -f docker/compose.yaml down        # data survives in volumes
name: inference-lab

networks:
  lab:
    name: inference-lab

volumes:
  prometheus-data:
  grafana-data:

services:
  prometheus:
    image: prom/prometheus:latest   # tested with Prometheus 3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [lab]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest   # tested with Grafana 13.2.2
    environment:
      # Local only (bound to 127.0.0.1): no login screen.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/inference-lab.json
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    networks: [lab]
    depends_on: [prometheus]
    restart: unless-stopped
