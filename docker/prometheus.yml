# Scrape both engines every 5 s. Only one runs at a time; the other target
# just shows as down.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: vllm
    static_configs:
      - targets: ["vllm:8000"]
        labels: {engine: vllm}

  - job_name: sglang
    static_configs:
      - targets: ["sglang:30000"]
        labels: {engine: sglang}
